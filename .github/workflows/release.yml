name: Release

# Builds the Windows installer (.msi) and publishes it as a GitHub Release. Triggered by pushing
# a tag like "v1.0.7" (the leading "v" is stripped to get the package version), or manually via
# "Run workflow" with an explicit version input.
#
# ffmpeg and whisper-cli are NOT bundled into the installer (see package-installer.ps1) -- the app
# downloads whichever it needs itself, on first run, from the same pinned/checksummed sources this
# workflow used to fetch at build time (now in ToolPackageOption.java). Bumping either to a newer
# build means updating the constants there, not anything in this workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.7, no leading v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        # The workflow_dispatch "version" input is passed in via an environment variable rather
        # than interpolated directly into this script's source text: a value like
        # `1.0.0"; <attacker command> #` would otherwise be spliced into the PowerShell literally
        # and execute as a script-injection. Reading it back with $env:DISPATCH_VERSION keeps it a
        # plain string value the whole way through, regardless of its content.
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = $env:DISPATCH_VERSION
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          Write-Host "Building version $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned to an exact build, not just "21": local dev machines are set up with this
          # same Temurin 21.0.11+10 (see CONTRIBUTING.md) so tests catch the same JDK-specific
          # issues end users will actually hit (this project has already been bitten by one --
          # see the -XX:TieredStopAtLevel=1 workaround in package-installer.ps1). Letting this
          # silently drift to whatever "latest 21.x" resolves to on a future run would defeat
          # that reproducibility.
          java-version: "21.0.11+10.0.LTS"
          cache: maven

      - name: Run tests
        run: mvn -B -q clean test

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          # windows-latest runners already ship a WiX Toolset 3.x install; only install one
          # via chocolatey if that's missing (e.g. a future runner image drops it), since
          # `choco install` errors out instead of no-op'ing when a newer version is already
          # present without --force/--allow-downgrade.
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path "$wixBin\candle.exe") {
            Write-Host "WiX Toolset already present at $wixBin"
          } else {
            choco install wixtoolset -y
          }

      - name: Build installer (.msi)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          $env:Path = "$wixBin;$env:Path"
          .\package-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $msi = Get-ChildItem "release-installer\*.msi" | Select-Object -First 1

          # Published alongside the .msi so anyone downloading it manually from the Releases page
          # can verify it wasn't corrupted or silently swapped for a different file after
          # publishing (the upload below uses --clobber, which allows exactly that).
          $checksumPath = "$($msi.FullName).sha256"
          (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower() + "  $($msi.Name)" |
              Out-File -FilePath $checksumPath -Encoding ascii -NoNewline

          # Idempotent: creates the tag/release if it doesn't exist yet (workflow_dispatch runs
          # without a pre-existing tag), or just uploads the asset if the tag-push trigger
          # already has the tag and gh has auto-created a draft/notes for it.
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $msi.FullName $checksumPath --title "transcritor-ata $tag" --generate-notes
          } else {
            gh release upload $tag $msi.FullName $checksumPath --clobber
          }
